services:
  tv-app-store:
    build: .
    container_name: tv-app-store
    restart: unless-stopped
    ports:
      - "9300:3000"
    volumes:
      - "./packages:/packages:ro"
      - "./data:/app/data"
    environment:
      PORT: 3000
      PACKAGE_DIR: /packages
      ICON_CACHE_DIR: /app/data/icons
